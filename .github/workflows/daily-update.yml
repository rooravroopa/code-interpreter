name: Daily Repository Update

on:
  schedule:
    - cron: '30 7 * * *'   # Runs daily at 07:30 UTC (specific time, no wildcards)
  workflow_dispatch:        # Allows manual trigger

jobs:
  update-repo:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Git
        run: |
          git config user.name "DevSync Automation"
          git config user.email "22f3000579@ds.study.iitm.ac.in"
          
      - name: Daily Commit Step - 22f3000579@ds.study.iitm.ac.in
        run: |
          echo "Run at $(date)" > daily-log.txt
          git add daily-log.txt
          git commit -m "Automated daily update $(date +%s)"
          git push
